name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 設計ミス（証拠の配り忘れ等）があればここで落とす
      - name: ケースを検査
        run: node tools/check.mjs

      # 1枚HTML（オフラインで動く配布版）を dist/ に焼く
      - name: 1枚HTMLをビルド
        run: node tools/build.mjs

      # 実ブラウザでの検査。PC では一度も再現しない崩れ方があるので、
      # スマホのビューポートもここで見る（「時々バグる」と報告が出た種類）
      - name: 実ブラウザで通し（ストーリー / クイズ 両方）
        run: node tools/smoke.mjs

      - name: 検出器そのものが鳴るかを確認
        run: node tools/check-mobile.mjs --self-test

      - name: スマホ表示の検査
        run: node tools/check-mobile.mjs

      - name: 1枚HTMLが file:// で完走するか
        run: node tools/check-portable.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
